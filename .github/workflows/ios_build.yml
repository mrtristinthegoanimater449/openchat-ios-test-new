name: Build unsigned IPAs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        app: [OpenChat, OpenSongs, OpenTik]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: Build unsigned iOS app
        working-directory: ${{ matrix.app }}
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        working-directory: ${{ matrix.app }}
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "${{ matrix.app }}-unsigned.ipa" Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-unsigned-ipa
          path: ${{ matrix.app }}/${{ matrix.app }}-unsigned.ipa
          retention-days: 1
